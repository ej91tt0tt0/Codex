name: ASTER standard Live voice checks

on:
  push:
    branches:
      - feature/realtime-voice
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python integration
        run: python -m py_compile live_proxy.py live_archive.py long_memory.py cost_guard.py data_guard.py restore_backup.py mobile_access.py server.py launch.py
      - name: Run all Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          node --check static/live.js
          node --check static/scope.js
          node --check static/app.js
          node --check static/realtime.js
          node --check static/archive.js
          node --check static/cinematic.js
          node --check static/mobile.js
          node --check static/astral.js
          node --check static/service-worker.js
      - name: Verify standard voice entry and classic fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          home = Path("static/index.html").read_text(encoding="utf-8")
          app = Path("static/app.js").read_text(encoding="utf-8")
          assert 'id="live-orb-action"' in home and 'id="live-start"' in home
          assert 'id="live-captions"' in home and 'href="/home-live.css"' in home
          assert 'id="voice-start"' in home and 'id="voice-stop"' in home
          assert "従来方式で開始" in app
          assert "if self.path == '/api/live/session':" in Path("server.py").read_text(encoding="utf-8")
          PY
