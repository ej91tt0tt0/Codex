<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>会話記録 | ASTER</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/aster-theme.css">
  <link rel="stylesheet" href="/cosmos.css">
  <link rel="stylesheet" href="/archive.css">
  <script src="/archive.js" defer></script>
</head>
<body class="cosmos-page archive-page">
  <div class="cosmos-background" aria-hidden="true">
    <span class="star-layer stars-distant"></span>
    <span class="star-layer stars-middle"></span>
    <span class="star-layer stars-near"></span>
  </div>
  <a class="skip-link" href="#archive-detail">記録本文に移動</a>
  <main class="archive-main">
    <header class="archive-header">
      <a href="/" class="brand" aria-label="ASTER ホーム">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
          <path d="m20 1 4 15 15 4-4 15-4-15-15-4 15-4z"/>
          <circle cx="20" cy="20" r="2" class="brand-center"/>
        </svg>ASTER<span class="brand-caption">PERSONAL AI</span>
      </a>
      <nav aria-label="ページ移動"><a href="/">← 音声ホームに戻る</a></nav>
    </header>
    <section class="archive-heading">
      <p class="eyebrow">ASTER / CONVERSATION ARCHIVE</p>
      <h1>会話記録</h1>
      <p class="hint">Live通話を終了すると、文字起こし・要約・重要トピックをこのPCに保存します。音声データは保存しません。要約の生成にはAPI料金が発生します。</p>
    </section>
    <div class="archive-layout">
      <section class="archive-list-panel" aria-labelledby="archive-list-heading">
        <div class="archive-panel-title">
          <h2 id="archive-list-heading">保存された会話</h2>
          <button id="archive-refresh" type="button" class="secondary">更新</button>
        </div>
        <p id="archive-list-status" class="hint" role="status"></p>
        <div id="archive-list" class="archive-list" aria-live="polite"></div>
      </section>
      <article id="archive-detail" class="archive-detail-panel" tabindex="-1">
        <p id="archive-detail-status" class="hint" role="status">左側から会話を選択してください。</p>
        <div id="archive-detail-content" hidden>
          <p class="eyebrow">CALL RECORD / DETAILS</p>
          <h2 id="archive-detail-title">会話</h2>
          <p id="archive-detail-date" class="archive-meta"></p>
          <h3>要約</h3>
          <p id="archive-summary" class="archive-summary"></p>
          <div id="archive-summary-actions" class="archive-actions"></div>
          <h3>重要トピック</h3>
          <div id="archive-topics" class="archive-topics"></div>
          <div class="archive-panel-title">
            <h3>会話全文（文字起こし）</h3>
            <button id="archive-copy" type="button" class="secondary">全文をコピー</button>
          </div>
          <p class="hint">話し声を自動文字起こしした記録です。誤認識や抜けが含まれる場合があります。</p>
          <div id="archive-transcript" class="archive-transcript"></div>
          <div class="archive-actions archive-danger-row">
            <button id="archive-delete" type="button" class="danger">この記録を削除</button>
          </div>
        </div>
      </article>
    </div>
  </main>
</body>
</html>
